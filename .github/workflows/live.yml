name: Wyniki na żywo (PFS)

# Finały MP 2026: sobota 21-11 od 11:00 do ~21:00, niedziela 22-11 do ~16:00 (czas polski = UTC+1).
# Harmonogram GitHuba bywa opóźniony o kilkadziesiąt minut, dlatego jedno uruchomienie pracuje w pętli
# (sprawdza transmisję co ~3 min) przez kilka godzin, a cron służy tylko do ponownego startu.
on:
  schedule:
    - cron: "*/30 10-19 21 11 *"   # sobota 11:00–20:30 czasu polskiego
    - cron: "*/30 8-14 22 11 *"    # niedziela 9:00–15:30 czasu polskiego
  workflow_dispatch:
    inputs:
      tour:
        description: "ID turnieju w transmisji PFS"
        default: "1400"
      dry_run:
        description: "Tylko sprawdź (bez zapisu)"
        type: boolean
        default: false
      minutes:
        description: "Jak długo pracować w pętli (min, maks. ~340)"
        default: "340"

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wyniki z transmisji PFS (pętla)
        env:
          TOUR_ID: ${{ inputs.tour || '1400' }}
          DRY: ${{ inputs.dry_run }}
          MINUTES: ${{ inputs.minutes || '340' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "mp-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DRY" = "true" ]; then python scripts/live_update.py --dry-run; exit 0; fi
          start=$(date +%s); stop=$((start + MINUTES*60))
          in_window() {
            d=$(date -u +%d); h=$(date -u +%H%M)
            # sobota 21-11 10:45–20:30 UTC (11:45–21:30 PL), niedziela 22-11 07:45–16:00 UTC (8:45–17:00 PL)
            if [ "$d" = "21" ] && [ "$h" \> "0945" ] && [ "$h" \< "2030" ]; then return 0; fi
            if [ "$d" = "22" ] && [ "$h" \> "0745" ] && [ "$h" \< "1600" ]; then return 0; fi
            return 1
          }
          first=1
          while :; do
            if in_window || [ $first = 1 ]; then
              first=0
              git pull -q --rebase origin main || true
              python scripts/live_update.py || echo "błąd pobierania – spróbuję za chwilę"
              if ! git diff --quiet -- docs/results.json; then
                git add docs/results.json
                git commit -q -m "Wyniki na żywo $(TZ=Europe/Warsaw date '+%d-%m-%Y %H:%M')"
                git push -q origin HEAD:main || { git pull -q --rebase origin main && git push -q origin HEAD:main; } || true
                curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
              fi
            fi
            [ $(( $(date +%s) + 200 )) -gt $stop ] && break
            sleep 180
          done
          # sztafeta: przed końcem turnieju (niedziela 22-11 16:00 UTC) uruchom następny przebieg,
          # bo harmonogram (cron) GitHuba bywa zawodny
          if [ "$(date -u +%Y%m%d%H%M)" \< "202611221600" ]; then
            echo "Uruchamiam następny przebieg"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
              -d '{"ref":"main","inputs":{"tour":"'"$TOUR_ID"'","minutes":"340"}}'
          else
            echo "Koniec turnieju – nie uruchamiam kolejnego przebiegu"
          fi
